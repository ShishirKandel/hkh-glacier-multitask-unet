# Rung B2 ??? B1 + terrain (elevation, slope): debris mimics rock spectrally,
# so terrain context is the hypothesised discriminator.
run: b2
seed: 20260716
channels: [0, 1, 2, 3, 4, 5, 6, 7, 13, 14]   # + terrain
crop: 256
batch: 8
lr: 0.0003
epochs: 30
patience: 8
aug: false
oversample_debris: 0
mmap: false
num_workers: 2
model: {depth: 4, base: 32, dropout: 0.0, attention: false}
heads: {dist: false}
loss:
  glacier: {bce: 1.0}
  type: {bce: 1.0}
  head_weights: {glacier: 1.0, type: 1.0}
  pos_weight_type: 1.0
eval_examples: 6
